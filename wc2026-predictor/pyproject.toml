[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wc26"
version = "0.1.0"
description = "FIFA World Cup 2026 prediction engine: ratings, goal models, market layer, hybrid ensemble, Monte Carlo simulation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pyarrow>=14.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
neural = ["torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
